name: Build MangaToAnime

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: mangaToAnime
      - run: npm run build:win
        working-directory: mangaToAnime
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MangaToAnime-Windows
          path: |
            mangaToAnime/dist/*.exe
            mangaToAnime/dist/win-unpacked/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: mangaToAnime
      - run: npm run build:mac
        working-directory: mangaToAnime
      - uses: actions/upload-artifact@v4
        with:
          name: MangaToAnime-macOS
          path: mangaToAnime/dist/*.dmg
